[package]
name = "quic-reality"
version = "0.1.0"
edition = "2021"
description = "QUIC + Reality stealth proxy: hy2 speed + Reality camouflage + Salamander + UDP"

[dependencies]
anyhow = "1"
bytes = "1"
blake2 = "0.10"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
futures = "0.3"
socket2 = "0.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
